services:
  app:
    image: isi-burger:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isi-burger-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    restart: unless-stopped
